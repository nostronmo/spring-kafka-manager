[tools]
uv = "latest"
python = "latest"
node = "latest"
bun = "latest"

[tasks.init]
description = "Start Venv Environment"
run = "if ! [ -f pyproject.toml ]; then uv init --no-workspace; fi"

[tasks.run]
description = "Run Application"
run = "mise x -- uv run python -m app.main"

[tasks.export]
description = "Export libraries"
run = "uv pip freeze > requirements.txt"

[tasks.add]
hide = true
description = "Add new library to environment"
run = "uv add"

[tasks.remove]
hide = true
description = "Remove a library from environment"
run = "uv remove"

[tasks.docker_run]
hide = true

[tasks.docker_stop]
hide = true
