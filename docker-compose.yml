services:
  postgres:
    build: .
    container_name: instantiator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - "5432:5432"
    volumes:
      - instancer_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:latest
    container_name: instancer-kafka
    restart: unless-stopped
    user: "root"
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=controller,broker

      - KAFKA_LISTENERS=EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094
      - KAFKA_ADVERTISED_LISTENERS=EXTERNAL://localhost:9092,INTERNAL://instancer-kafka:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@instancer-kafka:9094

      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1

      - KAFKA_LOG_RETENTION_HOURS=72
      - KAFKA_LOG_RETENTION_BYTES=10737418240
      - KAFKA_COMPRESSION_TYPE=gzip
      - KAFKA_NUM_NETWORK_THREADS=2
      - KAFKA_NUM_IO_THREADS=4

      - CLUSTER_ID=instancer-kafka-cluster
    volumes:
      - instancer_kafka_data:/tmp/kafka-logs

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: instancer-kafka-ui
    restart: unless-stopped
    ports:
      - "8020:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=instancer-Cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=instancer-kafka:9093
    depends_on:
      - kafka

volumes:
  instancer_postgres_data:
  instancer_kafka_data:
